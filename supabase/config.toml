# Configuración de Supabase CLI (supabase link / supabase functions deploy).
project_id = "monthly-para-despachos"

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Funciones que se llaman sin sesión de usuario.
[functions.oauth-callback]
verify_jwt = false

[functions.enviar-pendientes]
verify_jwt = false

[functions.t]
verify_jwt = false

[functions.baja]
verify_jwt = false
